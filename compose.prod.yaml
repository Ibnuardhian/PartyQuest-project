# Production stack for a single VPS behind an existing Nginx reverse proxy:

#   docker compose -f compose.prod.yaml --env-file .env.production up -d --build

# Caddy is disabled so ports 80/443 remain free for the host's Nginx.

# Next.js web container is bound to 127.0.0.1:3005 (configurable via WEB_HOST_PORT).

name: partyquest



services:

  postgres:

    image: postgres:17-alpine

    restart: unless-stopped

    environment:

      POSTGRES_DB: ${POSTGRES_DB:-partyquest}

      POSTGRES_USER: ${POSTGRES_USER:-partyquest}

      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}

    volumes:

      - postgres_data:/var/lib/postgresql/data

    healthcheck:

      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-partyquest} -d ${POSTGRES_DB:-partyquest}"]

      interval: 5s

      timeout: 5s

      retries: 20



  # One-shot: applies db/migrations before the web server starts (safe to rerun on every deploy).

  migrate:

    image: partyquest-web:latest

    build:

      context: .

      target: runner

    restart: "no"

    depends_on:

      postgres:

        condition: service_healthy

    environment:

      DATABASE_URL: postgres://${POSTGRES_USER:-partyquest}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-partyquest}

    command: ["node", "scripts/migrate.mjs"]



  # Removes expired rooms and finished/abandoned rooms idle for an hour (see cleanup_expired_rooms()).

  cleanup:

    image: postgres:17-alpine

    restart: unless-stopped

    depends_on:

      migrate:

        condition: service_completed_successfully

    environment:

      PGHOST: postgres

      PGUSER: ${POSTGRES_USER:-partyquest}

      PGPASSWORD: ${POSTGRES_PASSWORD}

      PGDATABASE: ${POSTGRES_DB:-partyquest}

    command: ["sh", "-c", "while true; do psql -tA -c 'select cleanup_expired_rooms()' || true; sleep 600; done"]



  web:

    image: partyquest-web:latest

    restart: unless-stopped

    depends_on:

      migrate:

        condition: service_completed_successfully

    # Runtime-only secrets: never build args, never NEXT_PUBLIC_.

    environment:

      DATABASE_URL: postgres://${POSTGRES_USER:-partyquest}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-partyquest}

      GUEST_SESSION_SECRET: ${GUEST_SESSION_SECRET:?Set GUEST_SESSION_SECRET in .env.production}

      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}

      TTS_PROVIDER: ${TTS_PROVIDER:-elevenlabs}

      TTS_VOICE: ${TTS_VOICE:-id-ID-ArdiNeural}

      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}

      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}

      ELEVENLABS_MODEL_ID: ${ELEVENLABS_MODEL_ID:-}

      WEREWOLF_VOICE_PILOT: ${WEREWOLF_VOICE_PILOT:-}

    volumes:

      - tts_cache:/var/cache/partyquest-tts

    ports:

      - "127.0.0.1:${WEB_HOST_PORT:-3005}:3000"

    healthcheck:

      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ > /dev/null || exit 1"]

      interval: 15s

      timeout: 5s

      retries: 5

    init: true



volumes:

  postgres_data:

  tts_cache: