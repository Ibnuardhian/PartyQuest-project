services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-partyquest}
      POSTGRES_USER: ${POSTGRES_USER:-partyquest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-partyquest_dev_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-partyquest} -d ${POSTGRES_DB:-partyquest}"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build:
      context: .
      target: dev
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      # Runtime-only values; never passed as build args or baked into the image.
      DATABASE_URL: postgres://${POSTGRES_USER:-partyquest}:${POSTGRES_PASSWORD:-partyquest_dev_only}@postgres:5432/${POSTGRES_DB:-partyquest}
      GUEST_SESSION_SECRET: ${GUEST_SESSION_SECRET:-local-dev-only-guest-session-secret-change-me}
      TTS_VOICE: ${TTS_VOICE:-id-ID-ArdiNeural}
      TTS_CACHE_DIR: /var/cache/partyquest-tts
      TTS_PROVIDER: ${TTS_PROVIDER:-microsoft}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
      ELEVENLABS_MODEL_ID: ${ELEVENLABS_MODEL_ID:-}
    command: ["sh", "-c", "npm run db:migrate && npm run dev"]
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
      - tts_cache:/var/cache/partyquest-tts
    init: true

volumes:
  postgres_data:
  node_modules:
  next_cache:
  tts_cache:
